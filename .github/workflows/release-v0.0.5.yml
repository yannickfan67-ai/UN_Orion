name: publish-v0.0.5

on:
  push:
    paths:
      - .github/workflows/release-v0.0.5.yml

permissions:
  actions: read
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: Download verified v0.0.5 release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir release
          gh run download 34132414315 \
            --repo "$GITHUB_REPOSITORY" \
            --name UN_Orion-v0.0.5-multi-firmware-release \
            --dir release
          for f in \
            UN_Orion-v0.0.5-x86_64-uefi.img \
            UN_Orion-v0.0.5-i686-bios.img \
            UN_Orion-v0.0.5-install.iso \
            orion-image-x86_64.json \
            orion-image-i686.json \
            orion-install-x86_64.json \
            UN_Orion-v0.0.5-source.zip \
            SHA256SUMS.txt; do
            test -f "release/$f"
          done

      - name: Ensure formal v0.0.5 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.0.5 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'v0.0.5 Release already exists.'
            exit 0
          fi
          cd release
          gh release create v0.0.5 \
            UN_Orion-v0.0.5-x86_64-uefi.img \
            UN_Orion-v0.0.5-i686-bios.img \
            UN_Orion-v0.0.5-install.iso \
            orion-image-x86_64.json \
            orion-image-i686.json \
            orion-install-x86_64.json \
            UN_Orion-v0.0.5-source.zip \
            SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target '83e6cf94e3eaf4c5894b60465a24b102db151614' \
            --title 'UN_Orion v0.0.5 Multi-Firmware & Vela Preview' \
            --notes 'UN_Orion v0.0.5: x86_64 UEFI desktop/install media, experimental i686 Legacy BIOS target, RTL8139 networking, UN_Vela 0.1, Aster Engine 0.1, Image ABI manifests and 86Box compatibility profile.'

      - name: Verify published v0.0.5 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/v0.0.5" --jq .target_commitish)" = '83e6cf94e3eaf4c5894b60465a24b102db151614'
          ASSETS="$(gh release view v0.0.5 --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
          for f in \
            UN_Orion-v0.0.5-x86_64-uefi.img \
            UN_Orion-v0.0.5-i686-bios.img \
            UN_Orion-v0.0.5-install.iso \
            orion-image-x86_64.json \
            orion-image-i686.json \
            orion-install-x86_64.json \
            UN_Orion-v0.0.5-source.zip \
            SHA256SUMS.txt; do
            grep -Fx "$f" <<<"$ASSETS"
          done
          echo 'UN_Orion v0.0.5 formal Release verified.'
