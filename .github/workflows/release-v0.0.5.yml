name: publish-v0.0.5

on:
  push:
    paths:
      - .github/workflows/release-v0.0.5.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout verified v0.0.5 source
        uses: actions/checkout@v4
        with:
          ref: 026a4cda2a305c34dc5546c24ea2da0d45096ac8
          fetch-depth: 0

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld llvm make qemu-system-x86 ovmf gnu-efi

      - name: Clean build and verify disk, ISO and network
        run: |
          make clean
          make all
          make iso
          make smoke
          make iso-smoke
          make network-smoke

      - name: Prepare release assets
        run: |
          cp build/orion.img UN_Orion-v0.0.5-network-browser.img
          cp build/UN_Orion-v0.0.5-install.iso UN_Orion-v0.0.5-install.iso
          git archive --format=zip --output=UN_Orion-v0.0.5-source.zip 026a4cda2a305c34dc5546c24ea2da0d45096ac8
          sha256sum \
            UN_Orion-v0.0.5-network-browser.img \
            UN_Orion-v0.0.5-install.iso \
            UN_Orion-v0.0.5-source.zip > SHA256SUMS.txt

      - name: Upload verified release bundle
        uses: actions/upload-artifact@v4
        with:
          name: UN_Orion-v0.0.5-verified-release-bundle
          path: |
            UN_Orion-v0.0.5-network-browser.img
            UN_Orion-v0.0.5-install.iso
            UN_Orion-v0.0.5-source.zip
            SHA256SUMS.txt

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.0.5 >/dev/null 2>&1; then
            echo 'v0.0.5 already exists; leaving it unchanged.'
            exit 0
          fi
          gh release create v0.0.5 \
            UN_Orion-v0.0.5-network-browser.img \
            UN_Orion-v0.0.5-install.iso \
            UN_Orion-v0.0.5-source.zip \
            SHA256SUMS.txt \
            --target 026a4cda2a305c34dc5546c24ea2da0d45096ac8 \
            --title 'UN_Orion v0.0.5 Network & Vela Preview' \
            --notes-file - <<'EOF'
          UN_Orion v0.0.5 turns the desktop preview into a network-capable system and introduces its own browser stack.

          Highlights:
          - from-scratch x86_64 UEFI kernel and native framebuffer desktop
          - RTL8139 PCI network driver
          - Ethernet II, ARP, IPv4, ICMP, UDP, DNS and a minimal TCP client
          - HTTP/1.0 GET support
          - UN_Vela 0.1 native browser shell
          - Aster Engine 0.1 HTML tokenizer, DOM, layout and paint pipeline
          - Network desktop application
          - Orion Browser retained as the lightweight/recovery browser line
          - OpenWrt lab profile and virtual-LAN helper
          - pure-Python ISO9660 / El Torito UEFI install-live media builder
          - bootable UEFI DVD ISO in addition to the raw disk image

          Release verification on a clean GitHub Actions runner includes:
          - raw-image QEMU/OVMF boot smoke test
          - El Torito UEFI DVD boot smoke test
          - real RTL8139 -> ARP -> IPv4 -> TCP -> HTTP network smoke test

          Current limitations:
          - the ISO is an install/live-media foundation; the target-disk installer is still under development
          - IPv4 configuration is static
          - TLS/HTTPS is not implemented yet
          - Aster does not yet implement CSS, JavaScript, images or a full HTML5 tree builder
          - Files/Notes persistence and on-disk ORX loading are still in progress
          EOF
