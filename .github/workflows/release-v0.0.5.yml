name: publish-v0.0.5

on:
  push:
    paths:
      - .github/workflows/release-v0.0.5.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout verified v0.0.5 source
        uses: actions/checkout@v4
        with:
          ref: 83e6cf94e3eaf4c5894b60465a24b102db151614
          fetch-depth: 0

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld llvm make qemu-system-x86 ovmf gnu-efi

      - name: Clean build and verify all boot paths
        run: |
          make clean
          make all
          make iso
          make legacy-i686
          make smoke
          make legacy-smoke
          make iso-smoke
          make install-smoke
          make network-smoke

      - name: Prepare release assets
        run: |
          cp build/orion.img UN_Orion-v0.0.5-x86_64-uefi.img
          cp build/UN_Orion-i686-bios.img UN_Orion-v0.0.5-i686-bios.img
          cp build/UN_Orion-v0.0.5-install.iso UN_Orion-v0.0.5-install.iso
          cp build/orion-image.json orion-image-x86_64.json
          cp build/orion-i686-bios.json orion-image-i686.json
          cp build/orion-install.json orion-install-x86_64.json
          git archive --format=zip --output=UN_Orion-v0.0.5-source.zip 83e6cf94e3eaf4c5894b60465a24b102db151614
          sha256sum \
            UN_Orion-v0.0.5-x86_64-uefi.img \
            UN_Orion-v0.0.5-i686-bios.img \
            UN_Orion-v0.0.5-install.iso \
            orion-image-x86_64.json \
            orion-image-i686.json \
            orion-install-x86_64.json \
            UN_Orion-v0.0.5-source.zip > SHA256SUMS.txt

      - name: Upload verified release bundle
        uses: actions/upload-artifact@v4
        with:
          name: UN_Orion-v0.0.5-multi-firmware-release
          path: |
            UN_Orion-v0.0.5-x86_64-uefi.img
            UN_Orion-v0.0.5-i686-bios.img
            UN_Orion-v0.0.5-install.iso
            orion-image-x86_64.json
            orion-image-i686.json
            orion-install-x86_64.json
            UN_Orion-v0.0.5-source.zip
            SHA256SUMS.txt

      - name: Create verified release tag
        run: |
          if git ls-remote --exit-code --tags origin refs/tags/v0.0.5 >/dev/null 2>&1; then
            echo 'v0.0.5 tag already exists.'
          else
            git tag v0.0.5 83e6cf94e3eaf4c5894b60465a24b102db151614
            git push origin refs/tags/v0.0.5
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.0.5 >/dev/null 2>&1; then
            echo 'v0.0.5 already exists; leaving it unchanged.'
            exit 0
          fi
          gh release create v0.0.5 \
            UN_Orion-v0.0.5-x86_64-uefi.img \
            UN_Orion-v0.0.5-i686-bios.img \
            UN_Orion-v0.0.5-install.iso \
            orion-image-x86_64.json \
            orion-image-i686.json \
            orion-install-x86_64.json \
            UN_Orion-v0.0.5-source.zip \
            SHA256SUMS.txt \
            --verify-tag \
            --title 'UN_Orion v0.0.5 Multi-Firmware & Vela Preview' \
            --notes-file - <<'EOF'
          UN_Orion v0.0.5 expands the desktop preview into a network-capable, multi-firmware development release.

          Highlights:
          - from-scratch x86_64 UEFI kernel and native framebuffer desktop
          - RTL8139 PCI networking with Ethernet II, ARP, IPv4, ICMP, UDP, DNS and minimal TCP
          - HTTP/1.0 client path
          - UN_Vela 0.1 browser shell and Aster Engine 0.1 rendering pipeline
          - Orion Browser retained as the lightweight/recovery browser line
          - bootable UEFI install ISO with an end-to-end target-disk installation smoke test
          - Orion Image ABI manifests for boot media
          - experimental i686 Legacy BIOS compatibility target
          - i686 protected-mode bootstrap with VGA text output, CPUID and legacy-PC compatibility hooks
          - 86Box CAIRO-5 / VIA-Centaur Samuel 600 MHz profile documented for local compatibility testing

          Verification on a clean GitHub Actions runner includes:
          - x86_64 raw-image UEFI boot smoke test
          - i686 Legacy BIOS boot smoke test
          - El Torito UEFI DVD boot smoke test
          - ISO -> blank disk install -> reboot from installed disk smoke test
          - RTL8139 -> ARP -> IPv4 -> TCP -> HTTP network smoke test

          Local 86Box validation additionally exercised the i686 path on a late legacy-PC profile with ATA/IDE, NE2000, PS/2, VGA and SB16-class hardware. External 86Box ROMs and emulator binaries are not redistributed by this release.

          Current limitations:
          - the i686 target is currently a compatibility/bootstrap target, not the full framebuffer desktop
          - IPv4 configuration is static
          - TLS/HTTPS is not implemented yet
          - Aster does not yet implement CSS, JavaScript, images or a full HTML5 tree builder
          - Files/Notes persistence and on-disk ORX loading are still in progress
          EOF
