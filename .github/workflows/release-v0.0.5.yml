name: publish-v0.0.5

on:
  push:
    paths:
      - .github/workflows/release-v0.0.5.yml

permissions:
  actions: read
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: Download verified v0.0.5 release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir release
          gh run download 34132414315 \
            --repo "$GITHUB_REPOSITORY" \
            --name UN_Orion-v0.0.5-multi-firmware-release \
            --dir release
          test -f release/UN_Orion-v0.0.5-x86_64-uefi.img
          test -f release/UN_Orion-v0.0.5-i686-bios.img
          test -f release/UN_Orion-v0.0.5-install.iso
          test -f release/SHA256SUMS.txt

      - name: Create verified v0.0.5 tag through GitHub API
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v0.0.5" >/dev/null 2>&1; then
            echo 'v0.0.5 tag already exists.'
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref='refs/tags/v0.0.5' \
              -f sha='83e6cf94e3eaf4c5894b60465a24b102db151614'
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.0.5 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'v0.0.5 Release already exists.'
            exit 0
          fi
          cd release
          gh release create v0.0.5 \
            UN_Orion-v0.0.5-x86_64-uefi.img \
            UN_Orion-v0.0.5-i686-bios.img \
            UN_Orion-v0.0.5-install.iso \
            orion-image-x86_64.json \
            orion-image-i686.json \
            orion-install-x86_64.json \
            UN_Orion-v0.0.5-source.zip \
            SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title 'UN_Orion v0.0.5 Multi-Firmware & Vela Preview' \
            --notes-file - <<'EOF'
          UN_Orion v0.0.5 expands the desktop preview into a network-capable, multi-firmware development release.

          Highlights:
          - x86_64 UEFI kernel, framebuffer desktop and bootable installer ISO
          - experimental i686 Legacy BIOS protected-mode compatibility target
          - RTL8139 networking: Ethernet II, ARP, IPv4, ICMP, UDP, DNS and minimal TCP
          - HTTP/1.0 client, UN_Vela 0.1 and Aster Engine 0.1
          - Orion Browser retained as the lightweight/recovery browser line
          - Orion Image ABI manifests for both firmware/architecture targets
          - documented 86Box CAIRO-5 / VIA-Centaur Samuel 600 MHz compatibility profile

          Verified before release:
          - x86_64 UEFI raw-image boot
          - i686 Legacy BIOS boot
          - UEFI El Torito ISO boot
          - ISO -> blank disk install -> disk-only reboot
          - RTL8139 -> ARP -> IPv4 -> TCP -> HTTP

          Local 86Box validation additionally exercised ATA/IDE, NE2000, PS/2, VGA and SB16-class hardware. External 86Box ROMs and emulator binaries are not redistributed.

          Current limitations:
          - i686 is currently a compatibility/bootstrap target, not the full framebuffer desktop
          - IPv4 configuration is static
          - TLS/HTTPS is not implemented yet
          - Aster does not yet implement CSS, JavaScript, images or a full HTML5 tree builder
          - Files/Notes persistence and on-disk ORX loading are still in progress
          EOF
