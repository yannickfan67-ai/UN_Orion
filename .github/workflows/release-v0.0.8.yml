name: publish-v0.0.8

on:
  push:
    paths:
      - .github/workflows/release-v0.0.8.yml

permissions:
  actions: read
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: Download verified main #183 media
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir release
          gh run download 34610509817 \
            --repo "$GITHUB_REPOSITORY" \
            --name UN_Orion-v0.0.8-multi-firmware-media \
            --dir release

      - name: Prepare v0.0.8 assets
        run: |
          cd release
          mv orion.img UN_Orion-v0.0.8-x86_64-uefi.img
          mv orion-image.json orion-image-x86_64.json
          mv orion-i686-bios.json orion-image-i686.json
          mv orion-install.json orion-install-x86_64.json
          rm -f OVMF_CODE.localtest.fd OVMF_VARS.localtest.fd
          sha256sum \
            UN_Orion-v0.0.8-x86_64-uefi.img \
            UN_Orion-v0.0.8-i686-bios.img \
            UN_Orion-v0.0.8-install.iso \
            orion-image-x86_64.json \
            orion-image-i686.json \
            orion-install-x86_64.json \
            > SHA256SUMS.txt

      - name: Publish v0.0.8
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd release
          gh release create v0.0.8 \
            UN_Orion-v0.0.8-x86_64-uefi.img \
            UN_Orion-v0.0.8-i686-bios.img \
            UN_Orion-v0.0.8-install.iso \
            orion-image-x86_64.json \
            orion-image-i686.json \
            orion-install-x86_64.json \
            SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target df04f89423794e9a48c195c9e18172ea1f8e6511 \
            --title 'UN_Orion v0.0.8 Native HTTPS & Compact Media' \
            --notes 'UN_Orion v0.0.8 adds native verified HTTPS browsing to the Orion network stack using BearSSL TLS 1.2. HTTPS now validates the CA chain, certificate hostname and certificate time against the RTC, requires runtime entropy from RDRAND, rejects HTTPS-to-HTTP downgrade redirects, and accepts responses only after a complete authenticated HTTP message frame is available. The embedded UN_Vela/Aster browser path is covered by a real QEMU HTTPS smoke test that exercises HTTP 302 -> TLS 1.2 -> certificate validation -> HTML -> UN_Vela -> Aster. This release also removes the old fixed 64 MiB UEFI image padding: x86_64 media now uses dynamically sized FAT16 storage and the current installer ISO is about 4.05 MiB, automatically growing to 8/16/32/... MiB as payload size requires. x86_64 UEFI boot, i686 Legacy BIOS full-system boot, ISO boot, end-to-end disk installation and verified HTTPS browser smoke all pass on the release commit. TLS 1.3 and OCSP/CRL checking are not yet implemented.'

      - name: Verify release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v0.0.8 --repo "$GITHUB_REPOSITORY" --json tagName,name,url,assets
          test "$(gh api repos/$GITHUB_REPOSITORY/releases/tags/v0.0.8 --jq '.assets | length')" -eq 7
