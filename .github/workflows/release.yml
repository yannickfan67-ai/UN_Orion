name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Verify release tag and project version
        run: |
          version="$(awk '/^VERSION :=/{print $3}' Makefile)"
          test -n "$version"
          test "v$version" = "$GITHUB_REF_NAME"
          python3 tools/check_version_sync.py

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld llvm make qemu-system-x86 ovmf gnu-efi ca-certificates openssl

      - name: Run host regression tests
        run: |
          make dhcp-smoke
          make aster-smoke
          mkdir -p build
          clang -std=c11 -Wall -Wextra -Werror -Iinclude kernel/dhcp.c tests/dhcp_timeout_smoke.c -o build/dhcp-timeout-smoke
          ./build/dhcp-timeout-smoke
          clang -std=c11 -Wall -Wextra -Werror -Iinclude kernel/pmm.c tests/pmm_recycle_smoke.c -o build/pmm-recycle-smoke
          ./build/pmm-recycle-smoke

      - name: Build release media
        run: |
          make all
          make iso
          make legacy-i686
          python3 -m json.tool build/orion-image.json >/dev/null
          python3 -m json.tool build/orion-install.json >/dev/null
          python3 -m json.tool build/orion-i686-bios.json >/dev/null

      - name: Validate release media
        run: |
          make smoke
          grep -q "DHCPv4 lease acquired" build/serial.log
          make legacy-smoke
          grep -q "DHCPv4 lease acquired" build/serial-i686.log
          make iso-smoke
          grep -q "DHCPv4 lease acquired" build/serial-iso.log
          make install-smoke
          make network-smoke

      - name: Prepare release assets
        run: |
          version="$(awk '/^VERSION :=/{print $3}' Makefile)"
          mkdir -p release
          cp build/orion.img "release/UN_Orion-v${version}-x86_64-uefi.img"
          cp "build/UN_Orion-v${version}-i686-bios.img" release/
          cp "build/UN_Orion-v${version}-install.iso" release/
          cp build/orion-image.json release/orion-image-x86_64.json
          cp build/orion-i686-bios.json release/orion-image-i686.json
          cp build/orion-install.json release/orion-install-x86_64.json
          cd release
          sha256sum \
            "UN_Orion-v${version}-x86_64-uefi.img" \
            "UN_Orion-v${version}-i686-bios.img" \
            "UN_Orion-v${version}-install.iso" \
            orion-image-x86_64.json \
            orion-image-i686.json \
            orion-install-x86_64.json \
            > SHA256SUMS.txt

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "UN_Orion $GITHUB_REF_NAME" \
            --generate-notes
