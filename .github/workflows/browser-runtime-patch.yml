name: browser-runtime-patch
on:
  push:
    branches: [feat/browser-runtime-0.3-20260909]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[browser-patch-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/browser-runtime-0.3-20260909
      - name: Apply browser runtime integration
        run: python3 tools/patch_browser_runtime.py
      - name: Commit patched sources
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No patch changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Makefile kernel/desktop.c kernel/net.c
          git commit -m "browser: wire desktop navigation images and wheel [browser-patch-applied]"
          git push origin HEAD:feat/browser-runtime-0.3-20260909
