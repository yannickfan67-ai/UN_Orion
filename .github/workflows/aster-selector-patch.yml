name: aster-selector-patch
on:
  push:
    branches: [feat/aster-selectors-0.3.1-20260909]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[aster-selector-patch-applied]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/aster-selectors-0.3.1-20260909
      - name: Apply Aster selector patch
        run: python3 tools/patch_aster_selectors.py
      - name: Run selector smoke
        run: make aster-smoke
      - name: Commit patched sources
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kernel/aster.c Makefile .github/workflows/build.yml
          if git diff --cached --quiet; then
            echo "No patch changes needed"
            exit 0
          fi
          git commit -m "browser: add Aster class and id selectors [aster-selector-patch-applied]"
          git push origin HEAD:feat/aster-selectors-0.3.1-20260909
