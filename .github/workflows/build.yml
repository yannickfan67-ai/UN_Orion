name: build

on:
  push:
  pull_request:

jobs:
  build-and-smoke-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld llvm make qemu-system-x86 ovmf gnu-efi ca-certificates openssl
      - name: Aster selector host smoke
        run: make aster-smoke
      - name: Build boot media with native TLS trust store
        run: |
          make all
          make iso
          make legacy-i686
          python3 -m json.tool build/orion-image.json >/dev/null
          python3 -m json.tool build/orion-install.json >/dev/null
          python3 -m json.tool build/orion-i686-bios.json >/dev/null
      - name: QEMU x86_64 UEFI boot smoke test
        run: make smoke
      - name: QEMU i686 Legacy BIOS full-system smoke test
        run: make legacy-smoke
      - name: QEMU i686 Legacy BIOS hard-disk smoke test
        run: |
          img="$(ls build/UN_Orion-v*-i686-bios.img | head -n1)"
          rm -f build/serial-i686-hdd.log
          set +e
          timeout 15s qemu-system-i386 -machine pc -m 128M \
            -drive if=ide,index=0,media=disk,format=raw,file="$img" -boot c \
            -netdev user,id=n0 -device rtl8139,netdev=n0,romfile= \
            -display none -monitor none -serial file:build/serial-i686-hdd.log
          rc=$?
          set -e
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 124 ]; then exit "$rc"; fi
          grep -q "UN_Orion 0.0.9 alive" build/serial-i686-hdd.log
          grep -q "PMM ready" build/serial-i686-hdd.log
          grep -q "Orion desktop ready" build/serial-i686-hdd.log
          grep -q "Network stack ready" build/serial-i686-hdd.log
          echo "i686 Legacy BIOS hard-disk smoke test passed"
      - name: QEMU UEFI install ISO smoke test
        run: make iso-smoke
      - name: QEMU end-to-end disk installation test
        run: make install-smoke
      - name: QEMU verified HTTPS browser smoke test
        run: make network-smoke
      - name: Prepare local-test firmware
        run: |
          code="$(find /usr/share/OVMF -maxdepth 1 -type f \( -name 'OVMF_CODE_4M.fd' -o -name 'OVMF_CODE.fd' \) | head -n1)"
          vars="$(find /usr/share/OVMF -maxdepth 1 -type f \( -name 'OVMF_VARS_4M.fd' -o -name 'OVMF_VARS.fd' \) | head -n1)"
          test -n "$code" -a -n "$vars"
          cp "$code" build/OVMF_CODE.localtest.fd
          cp "$vars" build/OVMF_VARS.localtest.fd
      - name: Upload boot media
        uses: actions/upload-artifact@v4
        with:
          name: UN_Orion-v0.0.9-multi-firmware-media
          path: |
            build/orion.img
            build/orion-image.json
            build/UN_Orion-v0.0.9-install.iso
            build/orion-install.json
            build/UN_Orion-v0.0.9-i686-bios.img
            build/orion-i686-bios.json
            build/OVMF_CODE.localtest.fd
            build/OVMF_VARS.localtest.fd
