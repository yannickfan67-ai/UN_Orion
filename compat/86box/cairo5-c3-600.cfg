; UN_Orion 86Box newest practical compatibility profile (tested with build 9001).
; Requires external 86Box ROMs; ROM files are intentionally not part of UN_Orion.
[General]
emu_build_num = 9001
sound_muted = 1
vid_renderer = qt_software
video_filter_method = 0

[Machine]
machine = cairo5
cpu_family = c3_samuel
cpu_speed = 600000000
cpu_multi = 6
cpu_use_dynarec = 1
fpu_type = internal
mem_size = 131072

[Video]
gfxcard = voodoo3_3500_agp

[Input devices]
keyboard_type = keyboard_at
mouse_type = ps2

[Sound]
sndcard = sb16

[Network]
net_01_card = ne2k
net_01_link = 1
net_01_net_type = slirp
net_01_promisc = 0
net_02_link = 0
net_03_link = 0
net_04_link = 0

[NE2000 Compatible #1]
base = 0300
irq = 3
bios_addr = 00000
mac = 34:56:78
mac_oui = 00:86:b0

[Storage controllers]
hdc_1 = internal
fdc = internal

[Hard disks]
; Create a disposable 32 MiB raw disk when running smoke tests.
hdd_01_fn = orion-test-hdd.img
hdd_01_ide_channel = 0:0
hdd_01_parameters = 63, 16, 65, 0, ide
hdd_01_speed = ramdisk

[Floppy and CD-ROM drives]
fdd_01_fn = UN_Orion-i686-bios.img
fdd_01_type = 35_2hd
fdd_02_type = none
